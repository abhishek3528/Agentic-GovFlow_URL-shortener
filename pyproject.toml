[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govflow"
version = "0.1.0"
description = "Governed agentic SDLC orchestration, demonstrated on a URL-shortener service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
govflow = "scenarios.cli:main"

[tool.setuptools]
packages = ["app", "orchestrator", "scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
